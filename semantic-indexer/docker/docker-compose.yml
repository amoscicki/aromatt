version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: semantic-indexer-db
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer_dev
      POSTGRES_DB: codebase_index
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d codebase_index"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgvector_data:
